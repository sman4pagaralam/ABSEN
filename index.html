        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #001233;
            background: linear-gradient(135deg, #001233 0%, #002266 30%, #0033aa 60%, #0044ff 100%);
            display: flex;

        .container {

            width: 100%;

            text-align: center;
        }
        .logo-wrapper {
            display: inline-block;

            padding: 18px;

            margin-bottom: 15px;

        }
        .logo-wrapper img {

        h1 span {
            background: linear-gradient(135deg, #4dc9f6 0%, #0066ff 50%, #0044cc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {

            font-size: 15px;

        }

            padding: 17px;
            background: linear-gradient(135deg, #0066ff 0%, #0044cc 50%, #0033aa 100%);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 30px rgba(0, 100, 255, 0.3);
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 40px rgba(0, 100, 255, 0.5);
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.2);
            font-size: 12px;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid #0088ff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .info-box {
            background: rgba(0, 50, 150, 0.15);
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid rgba(0, 100, 255, 0.1);
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            line-height: 1.7;
        }
        @media (max-width: 480px) {
            .container { padding: 30px 20px; }
            h1 { font-size: 24px; }
            .btn-primary { font-size: 15px; padding: 15px; }
